<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterMQ - Broker Script Help</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: var(--background-secondary, #12141a);
            color: var(--text-primary, #e8eaed);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .help-container {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .help-nav {
            position: sticky;
            top: 0;
            align-self: start;
            background: var(--background-primary, #1a1d28);
            border-right: 1px solid var(--border-color, #2d3139);
            padding: 1.5rem 1rem;
            max-height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .help-nav h3 {
            margin: 0 0 0.75rem 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary, #9ca3af);
            font-weight: 700;
        }

        .help-nav-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
        }

        .help-nav-list li {
            margin-bottom: 0.25rem;
        }

        .help-nav-list a {
            display: block;
            padding: 0.4rem 0.6rem;
            color: var(--text-secondary, #9ca3af);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .help-nav-list a:hover {
            color: var(--text-primary, #e8eaed);
            background: rgba(255, 255, 255, 0.05);
        }

        .help-nav-list a.active {
            color: #fff;
            background: var(--primary-color, #7c3aed);
            font-weight: 600;
        }

        .help-content {
            padding: 2.5rem 3rem;
            overflow-y: auto;
            max-height: 100vh;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .lang-tabs-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color, #2d3139);
        }

        .lang-tabs-label {
            font-size: 0.85rem;
            color: var(--text-secondary, #9ca3af);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lang-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .lang-tab-btn {
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary, #9ca3af);
            border: 1px solid var(--border-color, #2d3139);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .lang-tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        .lang-tab-btn.active {
            background: var(--primary-color, #7c3aed);
            color: #fff;
            border-color: var(--primary-color, #7c3aed);
        }

        .help-section {
            margin-bottom: 3.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color, #2d3139);
        }

        .help-section:last-child {
            border-bottom: none;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 0.75rem 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h2 {
            font-size: 1.4rem;
            margin: 0 0 1rem 0;
            color: #e8eaed;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        h3 {
            font-size: 1.1rem;
            margin: 1.5rem 0 0.5rem 0;
            color: #d1d5db;
        }

        p {
            line-height: 1.6;
            color: #9ca3af;
            margin: 0 0 1rem 0;
        }

        ul, ol {
            line-height: 1.6;
            color: #9ca3af;
            padding-left: 1.5rem;
            margin: 0 0 1rem 0;
        }

        li {
            margin-bottom: 0.4rem;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-python { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-starlark { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-js { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }

        pre {
            background: #0f1117;
            border: 1px solid #2d3139;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            overflow-x: auto;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #e2e8f0;
            margin: 0.75rem 0 1.25rem 0;
        }

        code {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.85em;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            color: #e2e8f0;
        }

        pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
        }

        .api-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0 1.5rem 0;
            font-size: 0.875rem;
        }

        .api-table th, .api-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #2d3139;
        }

        .api-table th {
            background: #1a1d28;
            color: #e8eaed;
            font-weight: 600;
        }

        .api-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .card-tip {
            background: rgba(124, 58, 237, 0.08);
            border-left: 3px solid #7c3aed;
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            margin: 1rem 0 1.5rem 0;
        }
        .card-tip p { margin: 0; color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="help-container">
        <nav class="help-nav" id="help-nav-container">
            <h3>Contents</h3>
            <ul class="help-nav-list" id="nav-list">
                <li><span style="font-size: 0.85rem; color: var(--text-secondary, #9ca3af);">Loading...</span></li>
            </ul>
        </nav>

        <main class="help-content" id="help-content-area">
            <div id="lang-tabs-bar" class="lang-tabs-bar" style="display: none;">
                <span class="lang-tabs-label">Runtime:</span>
                <div class="lang-tabs" id="lang-tabs-container"></div>
            </div>

            <div id="doc-render-target">
                <div style="padding: 3rem 1rem; text-align: center; color: var(--text-secondary, #9ca3af);">
                    <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">Loading documentation from broker...</p>
                    <p style="font-size: 0.85rem; opacity: 0.7;">Fetching supported language references via GraphQL</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let loadedLanguages = [];
        let activeLangName = '';

        function escapeHtml(str) {
            return (str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Lightweight Markdown to HTML renderer for broker documentation
        function renderMarkdownToHtml(md) {
            if (!md) return '';
            const lines = md.split('\n');
            let html = '';
            let inCodeBlock = false;
            let codeLang = '';
            let codeLines = [];
            let inTable = false;
            let tableHeader = true;
            let inList = false;
            let currentSectionId = '';

            function closeList() {
                if (inList) {
                    html += '</ul>';
                    inList = false;
                }
            }

            function closeTable() {
                if (inTable) {
                    html += '</tbody></table>';
                    inTable = false;
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Code block toggle
                if (line.trim().startsWith('```')) {
                    closeList();
                    closeTable();
                    if (inCodeBlock) {
                        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
                        codeLines = [];
                        inCodeBlock = false;
                    } else {
                        inCodeBlock = true;
                        codeLang = line.trim().substring(3).trim();
                        codeLines = [];
                    }
                    continue;
                }

                if (inCodeBlock) {
                    codeLines.push(line);
                    continue;
                }

                const trimmed = line.trim();

                // Horizontal rule
                if (trimmed === '---' || trimmed === '***') {
                    closeList();
                    closeTable();
                    continue;
                }

                // Headings
                if (trimmed.startsWith('# ') && !trimmed.startsWith('## ')) {
                    closeList();
                    closeTable();
                    const title = trimmed.substring(2);
                    html += `<section id="overview" class="help-section"><h1>${escapeHtml(title)}</h1>`;
                    currentSectionId = 'overview';
                    continue;
                }

                if (trimmed.startsWith('## ')) {
                    closeList();
                    closeTable();
                    if (currentSectionId) html += `</section>`;
                    const title = trimmed.substring(3);
                    const secId = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                    currentSectionId = secId;
                    html += `<section id="${secId}" class="help-section"><h2>${escapeHtml(title)}</h2>`;
                    continue;
                }

                if (trimmed.startsWith('### ')) {
                    closeList();
                    closeTable();
                    const title = trimmed.substring(4);
                    html += `<h3>${escapeHtml(title)}</h3>`;
                    continue;
                }

                // Table row
                if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
                    closeList();
                    // Divider row
                    if (/^\|[\s\-:|]+\|$/.test(trimmed)) {
                        continue;
                    }
                    const cols = trimmed.substring(1, trimmed.length - 1).split('|').map(c => c.trim());
                    if (!inTable) {
                        inTable = true;
                        tableHeader = true;
                        html += `<table class="api-table"><thead><tr>`;
                        cols.forEach(c => {
                            html += `<th>${formatInline(c)}</th>`;
                        });
                        html += `</tr></thead><tbody>`;
                    } else {
                        html += `<tr>`;
                        cols.forEach(c => {
                            html += `<td>${formatInline(c)}</td>`;
                        });
                        html += `</tr>`;
                    }
                    continue;
                } else if (inTable) {
                    closeTable();
                }

                // Blockquotes
                if (trimmed.startsWith('>')) {
                    closeList();
                    const text = trimmed.replace(/^>\s*/, '');
                    html += `<div class="card-tip"><p>${formatInline(text)}</p></div>`;
                    continue;
                }

                // Lists
                if (trimmed.startsWith('- ') || trimmed.startsWith('* ') || /^\d+\.\s/.test(trimmed)) {
                    const content = trimmed.replace(/^[-*]\s+|\d+\.\s+/, '');
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    html += `<li>${formatInline(content)}</li>`;
                    continue;
                } else if (inList && trimmed === '') {
                    closeList();
                }

                // Blank line
                if (trimmed === '') {
                    closeList();
                    continue;
                }

                // Standard paragraph
                closeList();
                html += `<p>${formatInline(trimmed)}</p>`;
            }

            closeList();
            closeTable();
            if (currentSectionId) html += `</section>`;

            return html;
        }

        function formatInline(text) {
            let res = escapeHtml(text);
            // inline code `code`
            res = res.replace(/`([^`]+)`/g, '<code>$1</code>');
            // bold **text**
            res = res.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // italic *text*
            res = res.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            // links [text](url)
            res = res.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            // br tags
            res = res.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
            return res;
        }

        function buildNavigationFromSections() {
            const sections = document.querySelectorAll('#doc-render-target .help-section');
            const navContainer = document.getElementById('help-nav-container');
            if (!navContainer || sections.length === 0) return;

            let navHtml = '<h3>Contents</h3><ul class="help-nav-list">';
            sections.forEach(sec => {
                const id = sec.getAttribute('id');
                const heading = sec.querySelector('h1, h2');
                const title = heading ? heading.textContent : id;
                if (id && title) {
                    navHtml += `<li><a href="#${id}">${escapeHtml(title)}</a></li>`;
                }
            });
            navHtml += '</ul>';
            navContainer.innerHTML = navHtml;
            bindNavLinks();
        }

        function bindNavLinks() {
            const navLinks = document.querySelectorAll('.help-nav-list a');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetId = link.getAttribute('href').replace('#', '');
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth' });
                        navLinks.forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                    }
                });
            });
        }

        function updateActiveNav() {
            const scrollPos = document.getElementById('help-content-area').scrollTop + 100;
            const sections = document.querySelectorAll('#doc-render-target .help-section');
            const navLinks = document.querySelectorAll('.help-nav-list a');

            sections.forEach(sec => {
                const top = sec.offsetTop;
                const height = sec.offsetHeight;
                const id = sec.getAttribute('id');
                if (scrollPos >= top && scrollPos < top + height) {
                    navLinks.forEach(link => {
                        const href = link.getAttribute('href');
                        link.classList.toggle('active', href === '#' + id);
                    });
                }
            });
        }

        function switchLanguage(langName) {
            const langObj = loadedLanguages.find(l => l.name === langName);
            if (!langObj || !langObj.documentation) return;

            activeLangName = langName;

            // Update tabs UI
            document.querySelectorAll('.lang-tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === langName);
            });

            // Render Markdown
            const target = document.getElementById('doc-render-target');
            target.innerHTML = renderMarkdownToHtml(langObj.documentation);

            // Rebuild TOC Navigation
            buildNavigationFromSections();
            document.getElementById('help-content-area').scrollTop = 0;
        }

        async function initDynamicDocs() {
            let langs = null;
            const query = `
                query GetScriptLanguagesDocs {
                    scriptLanguages {
                        name
                        displayName
                        description
                        isDefault
                        documentation
                    }
                }
            `;

            // 1. Try window or parent graphqlClient
            const client = window.graphqlClient || (window.parent && window.parent.graphqlClient);
            if (client && typeof client.query === 'function') {
                try {
                    const res = await client.query(query);
                    langs = res?.scriptLanguages;
                } catch (err) {
                    console.warn('GraphQL query via client failed:', err);
                }
            }

            // 2. Direct fetch fallback if client was not found or failed
            if (!langs) {
                try {
                    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                    const headers = { 'Content-Type': 'application/json' };
                    if (token && token !== 'null') {
                        headers['Authorization'] = 'Bearer ' + token;
                    }
                    const resp = await fetch('/graphql', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ query })
                    });
                    if (resp.ok) {
                        const json = await resp.json();
                        langs = json?.data?.scriptLanguages;
                    }
                } catch (e) {
                    console.warn('Direct fetch /graphql failed:', e);
                }
            }

            try {
                if (Array.isArray(langs) && langs.length > 0 && langs.some(l => l.documentation)) {
                    loadedLanguages = langs.filter(l => l.documentation);

                    // Show language tabs if multiple or at least 1
                    const tabsBar = document.getElementById('lang-tabs-bar');
                    const tabsContainer = document.getElementById('lang-tabs-container');
                    tabsContainer.innerHTML = '';

                    loadedLanguages.forEach(l => {
                        const btn = document.createElement('button');
                        btn.className = 'lang-tab-btn';
                        btn.dataset.lang = l.name;
                        btn.textContent = l.displayName || l.name;
                        btn.onclick = () => switchLanguage(l.name);
                        tabsContainer.appendChild(btn);
                    });

                    if (loadedLanguages.length > 1) {
                        tabsBar.style.display = 'flex';
                    }

                    // Select default language
                    let defaultLang = loadedLanguages.find(l => l.isDefault)?.name || loadedLanguages[0].name;
                    switchLanguage(defaultLang);
                } else {
                    bindNavLinks();
                }
            } catch (err) {
                console.warn('Could not load documentation from broker via GraphQL:', err);
                bindNavLinks();
            }
        }

        document.getElementById('help-content-area').addEventListener('scroll', updateActiveNav);

        // Initial launch
        initDynamicDocs();

        // Handle initial hash
        if (window.location.hash) {
            setTimeout(() => {
                const target = document.querySelector(window.location.hash);
                if (target) target.scrollIntoView();
            }, 200);
        }
    </script>
</body>
</html>
