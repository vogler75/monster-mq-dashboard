<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterMQ - TimeBase Loggers</title>
    <script type="module" src="/js/ix-init.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/graphql-client.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/log-viewer.js"></script>
    <script type="module" src="/js/sidebar.js"></script>
    
</head>
<body>
    <ix-application force-breakpoint="lg">
    <ix-menu application-name="MonsterMQ" pinned start-expanded></ix-menu>
    <div class="main-content" id="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">TimeBase Logger Management</h1>
                <p class="page-subtitle">Configure and manage TimeBase Historian loggers</p>
            </div>

            <div class="metrics-grid" style="margin-bottom: 2rem;">
                <div class="metric-card"><div class="metric-header"><span class="metric-title">Total Loggers</span></div><div class="metric-value" id="total-loggers">0</div><div class="metric-label">Configured</div></div>
                <div class="metric-card"><div class="metric-header"><span class="metric-title">Enabled</span></div><div class="metric-value" id="enabled-loggers">0</div><div class="metric-label">Active</div></div>
                <div class="metric-card"><div class="metric-header"><span class="metric-title">On Current Node</span></div><div class="metric-value" id="current-node-loggers">0</div><div class="metric-label">Local</div></div>
                <div class="metric-card"><div class="metric-header"><span class="metric-title">Messages/s</span></div><div class="metric-value" id="messages-rate">0</div><div class="metric-label">Throughput</div></div>
            </div>

            <div id="loggers-table" class="data-table" data-table-tools>
                <div class="table-header">
                    <div class="table-title"><h2>Logger Configuration</h2></div>
                    <div class="table-actions">
                        <ix-icon-button icon="refresh" variant="subtle-tertiary" onclick="refreshLoggers()" title="Refresh"></ix-icon-button>
                        <a href="/pages/timebase-logger-detail.html?new=true" class="btn btn-primary"><ix-icon name="add-circle" size="16"></ix-icon> Add Logger</a>
                    </div>
                </div>
                <div class="table-responsive"><table>
                    <thead><tr><th>Name</th><th>Endpoint</th><th>Dataset</th><th>Topic Filters</th><th>Node</th><th>Status</th><th>msg/s</th><th>Actions</th></tr></thead>
                    <tbody id="loggers-table-body"></tbody>
                </table></div>
            </div>

            <div id="error-message" class="error-message" style="display: none;">
                <div class="error-content"><span class="error-icon">&#9888;</span><span class="error-text"></span></div>
            </div>
        </div>
    </div>



    <script type="module" src="/js/timebase-loggers.js"></script>
    </ix-application>
</body>
</html>
