<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <!-- Background Radial Glow -->
        <radialGradient id="nexusBgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
        </radialGradient>

        <!-- Stream Gradients -->
        <linearGradient id="streamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22D3EE"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>

        <linearGradient id="streamEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>

        <linearGradient id="streamPurple" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#C084FC"/>
            <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>

        <linearGradient id="streamGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#EF4444"/>
        </linearGradient>

        <!-- Core Radiant Gradient -->
        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="25%" stop-color="#67E8F9"/>
            <stop offset="65%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
        </radialGradient>

        <!-- Filter for Glow Effects -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Ambient Glow Field -->
    <circle cx="64" cy="64" r="60" fill="url(#nexusBgGlow)"/>

    <!-- Outer Hexagonal Nexus Ring with Precision Gap Notches -->
    <polygon points="64,8 112,36 112,92 64,120 16,92 16,36" 
             fill="none" 
             stroke="#1E293B" 
             stroke-width="2.5" 
             stroke-dasharray="14 4 28 4 14"/>

    <polygon points="64,12 108,38 108,90 64,116 20,90 20,38" 
             fill="rgba(15, 23, 42, 0.45)" 
             stroke="url(#streamCyan)" 
             stroke-width="1.5" 
             stroke-opacity="0.4"/>

    <!-- Converging Nexus Data Hyperlanes (Intersecting Hexagram Curves) -->
    <!-- Lane 1: Cyan Top-Left to Center to Bottom-Right -->
    <path d="M 28,34 Q 64,52 64,64 T 100,94" 
          fill="none" 
          stroke="url(#streamCyan)" 
          stroke-width="4.5" 
          stroke-linecap="round"
          filter="url(#neonGlow)"/>

    <!-- Lane 2: Emerald Bottom-Left to Center to Top-Right -->
    <path d="M 28,94 Q 64,76 64,64 T 100,34" 
          fill="none" 
          stroke="url(#streamEmerald)" 
          stroke-width="4.5" 
          stroke-linecap="round"
          filter="url(#neonGlow)"/>

    <!-- Lane 3: Electric Purple Vertical Spine Loop (creating the "N" nexus link) -->
    <path d="M 64,18 L 64,110" 
          fill="none" 
          stroke="url(#streamPurple)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-dasharray="6 3"
          filter="url(#subtleGlow)"/>

    <!-- Interlocking Hexagonal Node Lattice -->
    <!-- Top Node (MQTT) -->
    <circle cx="64" cy="22" r="5.5" fill="#080C14" stroke="#22D3EE" stroke-width="2.5"/>
    <circle cx="64" cy="22" r="2.5" fill="#22D3EE"/>

    <!-- Bottom Node (Kafka) -->
    <circle cx="64" cy="106" r="5.5" fill="#080C14" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="64" cy="106" r="2.5" fill="#F59E0B"/>

    <!-- Left Top Node (NATS) -->
    <circle cx="28" cy="42" r="5.5" fill="#080C14" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="28" cy="42" r="2.5" fill="#10B981"/>

    <!-- Right Top Node (Redis) -->
    <circle cx="100" cy="42" r="5.5" fill="#080C14" stroke="#C084FC" stroke-width="2.5"/>
    <circle cx="100" cy="42" r="2.5" fill="#C084FC"/>

    <!-- Left Bottom Node (PeerLink) -->
    <circle cx="28" cy="86" r="5.5" fill="#080C14" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="28" cy="86" r="2.5" fill="#06B6D4"/>

    <!-- Right Bottom Node (Edge Vision) -->
    <circle cx="100" cy="86" r="5.5" fill="#080C14" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="100" cy="86" r="2.5" fill="#10B981"/>

    <!-- Center Radiant Nexus Core (The Convergence Point) -->
    <circle cx="64" cy="64" r="16" fill="url(#coreGlow)" filter="url(#neonGlow)"/>
    <polygon points="64,52 74,58 74,70 64,76 54,70 54,58" 
             fill="#080C14" 
             stroke="#FFFFFF" 
             stroke-width="2" 
             filter="url(#subtleGlow)"/>
    <circle cx="64" cy="64" r="4" fill="#FFFFFF"/>
</svg>
