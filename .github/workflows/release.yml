name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.8.29)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web dashboard
        run: npm run build

      - name: Package web zip
        run: |
          cd dist
          zip -r ../monstermq-dashboard-web.zip ./*
          cd ..

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: monstermq-dashboard-web
          path: monstermq-dashboard-web.zip

  build-desktop-mac:
    name: Build Desktop (macOS DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: ./build.sh --mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist-desktop/*.dmg

  build-desktop-win:
    name: Build Desktop (Windows Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows setup
        run: ./build.bat --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist-desktop/*.exe

  release:
    name: Create GitHub Release
    needs: [build-web, build-desktop-mac, build-desktop-win]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.exe" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
